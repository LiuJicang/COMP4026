data:
  image_root: .
  train_dir: FER-2013/train
  val_dir: FER-2013/test
  image_size: 112

model:
  backbone: mobilenet_v3_small
  pretrained: true
  num_classes: 7

train:
  batch_size: 32
  num_workers: 0
  epochs: 6
  lr: 0.0003
  weight_decay: 0.0001
  output_dir: face anonymisation/outputs/expression_teacher
