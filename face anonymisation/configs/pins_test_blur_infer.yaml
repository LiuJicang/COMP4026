data:
  image_root: D:/4026/COMP4026
  manifest_csv: ""
  source_dir: D:/4026/105_classes_pins_dataset_split_80_20/test
  label_mode: parent_dir
  output_dir: face anonymisation/outputs/pins_test_blur_infer
  supported_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".webp"]

detection:
  enabled: true
  cascade_path: ""
  scale_factor: 1.1
  min_neighbors: 4
  min_size: [32, 32]
  expand_ratio: 0.22
  fallback_mode: full_image

anonymizer:
  method: gaussian_blur
  apply_to: face
  gaussian_blur:
    kernel_size: 35
    min_kernel_size: 31
    adaptive_ratio: 0.42
    max_kernel_ratio: 0.9
    sigma: 0
    feather_blend: true
    feather_edge_ratio: 0.12
    feather_blur_kernel: 15
  pixelate:
    pixel_size: 12

export:
  anonymized_manifest: face anonymisation/outputs/pins_test_blur_infer/anonymized_manifest.csv
  paired_manifest: face anonymisation/outputs/pins_test_blur_infer/paired_manifest.csv
  summary_json: face anonymisation/outputs/pins_test_blur_infer/run_summary.json
