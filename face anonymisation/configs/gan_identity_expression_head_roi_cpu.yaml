data:
  image_root: .
  train_dir: CelebA-HQ/train
  val_dir: CelebA-HQ/val
  supported_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".webp"]
  image_size: 128
  max_train_images: 27000
  max_val_images: 3000
  crop:
    enabled: true
    crop_scale: 1.75
    upward_shift: 0.12
    jitter_ratio: 0.04
    fallback_scale: 0.92
    min_side_ratio: 0.58

detection:
  enabled: true
  scale_factor: 1.08
  min_neighbors: 4
  min_size: [40, 40]
  expand_ratio: 0.2
  fallback_mode: full_image

model:
  generator:
    base_channels: 48
    noise_channels: 1
    bottleneck_dropout: 0.1
    bottleneck_blocks: 3
    residual_output: true
    residual_scale: 0.65
  discriminator:
    base_channels: 48

train:
  batch_size: 4
  num_workers: 0
  epochs: 4
  lr_generator: 0.00012
  lr_discriminator: 0.00012
  betas: [0.5, 0.999]
  adv_weight: 0.6
  recon_weight: 12.0
  tv_weight: 0.00005
  label_smoothing: 0.9
  noise_std: 0.35
  generator_checkpoint: ""
  discriminator_checkpoint: ""
  output_dir: face anonymisation/outputs/gan_identity_expression_head_roi_cpu
  preview_samples: 6

guidance:
  identity:
    enabled: true
    pretrained: vggface2
    input_size: 160
    target_similarity: 0.18
    weight: 4.0
  expression:
    enabled: true
    checkpoint: face anonymisation/outputs/expression_teacher/best_model.pt
    backbone: mobilenet_v3_small
    num_classes: 7
    input_size: 112
    temperature: 2.0
    weight: 2.5

inference:
  checkpoint: face anonymisation/outputs/gan_identity_expression_head_roi_cpu/best_generator.pt
  source_dir: CelebA-HQ/val
  manifest_csv: ""
  label_mode: none
  output_dir: face anonymisation/outputs/gan_identity_expression_head_roi_cpu_infer
  batch_size: 1
  num_workers: 0
  apply_to: face
  detection_enabled: true
  noise_std: 0.3
  seed: 42
  region_aware:
    enabled: true
    base_strength: 0.7
    identity_strength: 1.0
    contour_strength: 1.0
    hair_strength: 1.0
    ear_strength: 1.0
    eye_strength: 1.0
    pupil_strength: 1.0
    nose_strength: 0.95
    brow_strength: 0.4
    cheek_strength: 0.2
    mouth_strength: 0.15
    softness: 0.14
    ellipse_exponent: 2.6
    head_center_x: 0.5
    head_center_y: 0.47
    head_radius_x: 0.62
    head_radius_y: 0.78
    head_ellipse_exponent: 2.3
    small_face_reference: 180
    small_face_base_boost: 0.18
    small_face_identity_boost: 0.2
    small_face_contour_boost: 0.2
    small_face_brow_penalty: 0.05
    small_face_mouth_penalty: 0.08
    small_face_cheek_penalty: 0.04
    mask_blur: 9

export:
  anonymized_manifest: face anonymisation/outputs/gan_identity_expression_head_roi_cpu_infer/anonymized_manifest.csv
  paired_manifest: face anonymisation/outputs/gan_identity_expression_head_roi_cpu_infer/paired_manifest.csv
  summary_json: face anonymisation/outputs/gan_identity_expression_head_roi_cpu_infer/run_summary.json
