data:
  image_root: .
  manifest_csv: ""
  source_dir: ""
  label_mode: none
  output_dir: face anonymisation/outputs/baseline_pixelate
  supported_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".webp"]

detection:
  enabled: true
  cascade_path: ""
  scale_factor: 1.1
  min_neighbors: 5
  min_size: [48, 48]
  expand_ratio: 0.15
  fallback_mode: full_image

anonymizer:
  method: pixelate
  apply_to: face
  gaussian_blur:
    kernel_size: 35
    sigma: 0
  pixelate:
    pixel_size: 12

export:
  anonymized_manifest: face anonymisation/outputs/baseline_pixelate/anonymized_manifest.csv
  paired_manifest: face anonymisation/outputs/baseline_pixelate/paired_manifest.csv
  summary_json: face anonymisation/outputs/baseline_pixelate/run_summary.json
