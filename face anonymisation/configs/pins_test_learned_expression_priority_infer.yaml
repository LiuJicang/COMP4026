data:
  image_root: D:/4026/COMP4026
  train_dir: CelebA-HQ/train
  val_dir: CelebA-HQ/val
  supported_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".webp"]
  image_size: 96

model:
  generator:
    base_channels: 32
    noise_channels: 1
    bottleneck_dropout: 0.2
  discriminator:
    base_channels: 32

train:
  batch_size: 4
  num_workers: 0
  epochs: 3
  lr_generator: 0.00015
  lr_discriminator: 0.00015
  betas: [0.5, 0.999]
  adv_weight: 1.0
  recon_weight: 8.0
  tv_weight: 0.0001
  label_smoothing: 0.9
  noise_std: 0.6
  generator_checkpoint: face anonymisation/outputs/gan_identity_expression_cpu/best_generator.pt
  discriminator_checkpoint: face anonymisation/outputs/gan_identity_expression_cpu/last_discriminator.pt
  output_dir: face anonymisation/outputs/gan_identity_expression_cpu_stage2
  preview_samples: 6

guidance:
  identity:
    enabled: true
    pretrained: vggface2
    input_size: 112
    target_similarity: 0.25
    weight: 3.0
  expression:
    enabled: true
    checkpoint: face anonymisation/outputs/expression_teacher/best_model.pt
    backbone: mobilenet_v3_small
    num_classes: 7
    input_size: 112
    temperature: 2.0
    weight: 2.0

inference:
  checkpoint: face anonymisation/outputs/gan_identity_expression_cpu_stage2/best_generator.pt
  source_dir: D:/4026/105_classes_pins_dataset_split_80_20/test
  manifest_csv: ""
  label_mode: parent_dir
  output_dir: face anonymisation/outputs/pins_test_learned_expression_priority_infer
  batch_size: 2
  num_workers: 0
  apply_to: face
  detection_enabled: true
  noise_std: 0.6
  seed: 42
  region_aware:
    enabled: true
    base_strength: 1.0
    identity_strength: 1.0
    contour_strength: 1.0
    brow_strength: 0.45
    mouth_strength: 0.28
    softness: 0.04
    ellipse_exponent: 0.35
    mask_blur: 17
    small_face_reference: 180
    small_face_base_boost: 0.0
    small_face_identity_boost: 0.0
    small_face_contour_boost: 0.0
    small_face_brow_penalty: 0.12
    small_face_mouth_penalty: 0.18
    post_blur_ratio: 0.0
    post_blur_min_kernel: 0

detection:
  enabled: true
  cascade_path: ""
  scale_factor: 1.1
  min_neighbors: 4
  min_size: [32, 32]
  expand_ratio: 0.22
  fallback_mode: full_image

export:
  anonymized_manifest: face anonymisation/outputs/pins_test_learned_expression_priority_infer/anonymized_manifest.csv
  paired_manifest: face anonymisation/outputs/pins_test_learned_expression_priority_infer/paired_manifest.csv
  summary_json: face anonymisation/outputs/pins_test_learned_expression_priority_infer/run_summary.json
