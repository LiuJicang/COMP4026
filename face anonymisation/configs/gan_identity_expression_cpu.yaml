data:
  image_root: .
  train_dir: CelebA-HQ/train
  val_dir: CelebA-HQ/val
  supported_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".webp"]
  image_size: 96
  max_train_images: 2000
  max_val_images: 200

model:
  generator:
    base_channels: 32
    noise_channels: 1
    bottleneck_dropout: 0.2
  discriminator:
    base_channels: 32

train:
  batch_size: 4
  num_workers: 0
  epochs: 2
  lr_generator: 0.0002
  lr_discriminator: 0.0002
  betas: [0.5, 0.999]
  adv_weight: 1.0
  recon_weight: 6.0
  tv_weight: 0.0001
  label_smoothing: 0.9
  noise_std: 0.8
  output_dir: face anonymisation/outputs/gan_identity_expression_cpu
  preview_samples: 6

guidance:
  identity:
    enabled: true
    pretrained: vggface2
    input_size: 112
    target_similarity: 0.25
    weight: 3.0
  expression:
    enabled: true
    checkpoint: face anonymisation/outputs/expression_teacher/best_model.pt
    backbone: mobilenet_v3_small
    num_classes: 7
    input_size: 112
    temperature: 2.0
    weight: 2.0

inference:
  checkpoint: face anonymisation/outputs/gan_identity_expression_cpu/best_generator.pt
  source_dir: CelebA-HQ/val
  manifest_csv: ""
  label_mode: none
  output_dir: face anonymisation/outputs/gan_identity_expression_cpu_infer
  batch_size: 2
  num_workers: 0
  apply_to: full_image
  detection_enabled: false
  noise_std: 0.8
  seed: 42

export:
  anonymized_manifest: face anonymisation/outputs/gan_identity_expression_cpu_infer/anonymized_manifest.csv
  paired_manifest: face anonymisation/outputs/gan_identity_expression_cpu_infer/paired_manifest.csv
  summary_json: face anonymisation/outputs/gan_identity_expression_cpu_infer/run_summary.json
