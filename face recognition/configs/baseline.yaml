data:
  image_root: face recognition/data
  train_dir: train
  test_dir: test
  anonymized_test_dir: ""

preprocess:
  image_size: [128, 128]
  equalize_hist: true
  fallback_mode: full_image
  detector:
    cascade_path: ""
    scale_factor: 1.1
    min_neighbors: 5
    min_size: [48, 48]

model:
  num_components: 0
  threshold: 4500.0

train:
  output_dir: face recognition/outputs/baseline

eval:
  save_json: true
